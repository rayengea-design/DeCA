                "@type": "Question",
                "name": "¿Qué es el DeCA y por qué es obligatorio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "El Documento electrónico de Control Administrativo (DeCA) es el documento que deben llevar los transportes nacionales de mercancías por carretera en España, según la Orden FOM/2861/2012 y la Resolución de 5 de junio de 2026. Desde el 5 de octubre de 2026 es obligatorio en cada porte."
                }
              },

                "@type": "Question",
                "name": "¿Qué pasa si no llevo el DeCA?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No llevarlo, o llevarlo mal cumplimentado, puede suponer una sanción de entre 401€ y 20.000€ según la infracción."
                }
              },

                "@type": "Question",
                "name": "¿Cada conductor necesita su propia cuenta?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí, y es lo recomendable: das de alta a cada conductor con su acceso, cada uno genera y ve solo sus propios DeCA, y tú ves los de toda la empresa."
                }
              },

                "@type": "Question",
                "name": "¿Puedo cancelar cuando quiera?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Gestionas tu suscripción, cambias de plan o cancelas desde tu propio panel, sin llamadas ni permanencia. Si cancelas, mantienes acceso hasta el final del periodo ya pagado."
                }
              },
              {
                "@type": "Question",
                "name": "¿Necesito instalar algo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Funciona desde el navegador del móvil o el ordenador, y se puede añadir a la pantalla de inicio como una app (PWA) que sigue funcionando sin cobertura."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo cambiar de plan más adelante?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí, en cualquier momento desde Facturación. El cambio se aplica al final de tu periodo actual: sigues en tu plan de ahora hasta entonces y solo se te cobra la nueva cuota cuando toca renovar."
                }
              },

                "@type": "Question",
                "name": "¿Qué pasa con mis DeCA si dejo de pagar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Todos los documentos ya generados se conservan y siguen siendo descargables — es una obligación legal de conservación de 1 año, no depende de tu suscripción. Lo que se detiene es poder generar DeCA nuevos."
                }
              },

                "@type": "Question",
                "name": "¿Cómo se calcula y se cobra el IVA?",

                  "@type": "Answer",
                  "text": "El precio de cada plan no incluye IVA — se calcula y se muestra desglosado en el momento del pago, y cada cobro genera automáticamente su factura, que recibes por email."
